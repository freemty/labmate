name: Bug Report
description: Report a bug in LabMate
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Claude Code
        - OpenAI Codex
        - Google Antigravity
        - Other
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host version
      placeholder: "e.g. codex-cli 0.145.0 or Claude Code 1.0.12"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related skill or agent (optional)
      placeholder: "e.g. domain-expert role or analyze-experiment skill"
